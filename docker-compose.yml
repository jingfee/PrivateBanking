services:
  privatebanking:
    # Pulled from the registry CI publishes to; `docker compose build` builds it locally instead.
    image: ${PB_IMAGE:-ghcr.io/jingfee/privatebanking}:${PB_TAG:-latest}
    build: .
    container_name: privatebanking
    restart: unless-stopped
    # Settings come from the environment: a .env file next to this file, or the
    # environment configured in your deploy tool. See .env.example.
    environment:
      EB_APP_ID: ${EB_APP_ID:?set EB_APP_ID}
      EB_REDIRECT_URL: ${EB_REDIRECT_URL:?set EB_REDIRECT_URL}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      DATABASE_PATH: /data/privatebanking.db
      EB_KEY_PATH: /secrets/eb.pem
    volumes:
      # Keep data and the key outside the stack directory if your deploy tool may recreate it.
      - ${PB_DATA_DIR:-./data}:/data
      - ${PB_KEY_FILE:-./secrets/eb.pem}:/secrets/eb.pem:ro
    ports:
      # A reverse proxy on the same host proxies to 127.0.0.1:8000. If it runs elsewhere,
      # set PB_LISTEN in .env to an address it can reach (e.g. <server-ip>:8000).
      - "${PB_LISTEN:-127.0.0.1:8000}:8000"
