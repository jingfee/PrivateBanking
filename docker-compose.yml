services:
  privatebanking:
    build: .
    container_name: privatebanking
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/privatebanking.db
      EB_KEY_PATH: /secrets/eb.pem
    volumes:
      - ./data:/data
      - ./secrets/eb.pem:/secrets/eb.pem:ro
    ports:
      # Caddy on the same host proxies to 127.0.0.1:8000. If Caddy runs elsewhere,
      # set PB_LISTEN in .env (e.g. 192.168.1.10:8000).
      - "${PB_LISTEN:-127.0.0.1:8000}:8000"
